services:
  headlendingvisitreportapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: headlendingvisitreportapi:latest
    container_name: headlendingvisitreportapi
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      TZ: Asia/Kolkata
      DB_TimeZone: Asia/Kolkata
    volumes:
      - uploads_data:/app/App_Data/Uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  uploads_data:
